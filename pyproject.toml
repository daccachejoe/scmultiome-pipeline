[project]
name = "scmultiome-pipeline"
version = "2.0.0"
description = "Single-cell multiome (RNA+ATAC) analysis pipeline"
requires-python = ">=3.9"
dependencies = []

# Python dependencies are split by conda env (see config/pipeline.config:
# UCD_env_name, scenicplus_env_name, decoder_env_name) since UCDeconvolve,
# SCENIC+, and PyTorch pin conflicting dependency versions and cannot share
# one environment.
# Install with: uv pip install -e ".[ucd]"        (in the UCD_env_name env)
#               uv pip install -e ".[scenicplus]" (in the scenicplus_env_name env)
#               uv pip install -e ".[decoder]"    (in the decoder_env_name env)
# then run `uv lock` in each env to produce a real, resolved uv.lock.
[project.optional-dependencies]
ucd = [
    "scanpy",
    "ucdeconvolve",
]
scenicplus = [
    "scenicplus",
    "pycisTopic",
    "pyranges",
    "anndata",
    "scanpy",
    "pandas",
    "pyyaml",
]
decoder = [
    "torch",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
]
# stage 00b demultiplexing (scripts/demultiplex/); pinned to the versions its
# regression against prelim-long-data's hand-run outputs was checked with
demux = [
    "pysam==0.22.1",
    "numpy==2.1.0",
    "scipy==1.14.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
